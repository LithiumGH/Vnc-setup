name: Linux Desktop (browser VNC)

# Spins up a real Linux desktop (XFCE by default) on a GitHub-hosted runner and
# streams it to your browser over HTTPS. The runner has no inbound ports, so the
# desktop is published through a Cloudflare Quick Tunnel, which needs no account.
#
# The session is ephemeral: it dies when the job ends or you cancel it, and the
# public URL stops working at that moment.

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: Distro and desktop flavor
        type: choice
        default: fedora-xfce
        options:
          - ubuntu-xfce
          - ubuntu-mate
          - ubuntu-kde
          - ubuntu-lxqt
          - ubuntu-i3
          - fedora-xfce
          - fedora-mate
          - fedora-kde
          - fedora-i3
          - debian-xfce
          - debian-mate
          - debian-kde
          - debian-i3
          - arch-xfce
          - arch-mate
          - arch-kde
          - arch-i3
      session_minutes:
        description: Session length in minutes (max 355)
        type: number
        default: 240
      password:
        description: Password (blank = use the VNC_PASSWORD secret, or auto-generate)
        type: string
        required: false
      allowed_emails:
        description: Restrict access to these emails via Cloudflare one-time PIN
        type: string
        required: false
      mount_workspace:
        description: Mount this repo's working copy at /config/workspace
        type: boolean
        default: true
      cache_config:
        description: Cache /config so installed apps and files survive the session
        type: boolean
        default: true
      software_render:
        description: Force llvmpipe CPU rendering (runners have no GPU)
        type: boolean
        default: true
      resolution:
        description: Desktop size, e.g. 1280x720
        type: string
        default: '1280x720'
      save_packages:
        description: Snapshot newly installed packages into desktop-packages.txt and commit
        type: boolean
        default: true
      runner:
        description: Runner label. Use "self-hosted, gpu" for your own GPU box
        type: string
        default: ubuntu-latest
      gpu:
        description: Pass a GPU into the desktop container
        type: choice
        default: 'none'
        options:
          - 'none'      # CPU only, llvmpipe software rendering
          - 'nvidia'    # requires --gpus all and nvidia-container-toolkit
          - 'amd'       # requires --device /dev/dri/renderD128
      wayland:
        description: Use the Wayland compositor (needed for real GPU rendering)
        type: boolean
        default: false

permissions:
  contents: read

# One desktop at a time; a second run would fight over the same ports.
concurrency:
  group: ubuntu-desktop
  cancel-in-progress: true

jobs:
  desktop:
    name: Linux desktop
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    permissions:
      # Needed only to commit desktop-packages.txt back to the repo.
      contents: write
    env:
      # Pinned rather than left to the script's TMPDIR default, so every step
      # agrees on where state.env lives.
      DESKTOP_STATE_DIR: /tmp/ubuntu-desktop-vnc
    outputs:
      url: ${{ steps.publish.outputs.url }}
      password: ${{ steps.publish.outputs.password }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache desktop home
        if: inputs.cache_config
        uses: actions/cache@v4
        with:
          path: /home/runner/desktop-config
          # Deliberately stable. Cache entries are immutable, so keying this on
          # run_id would mint a fresh entry every run and never update any of
          # them. /config is only a few MB, so one entry per flavor is plenty.
          # To start clean, change the key or delete the cache in the UI.
          key: desktop-config-${{ inputs.flavor }}
          restore-keys: |
            desktop-config-

      - name: Start desktop
        env:
          # Passed via env rather than interpolated into the shell body, so
          # Actions cannot read a secret value as script injection.
          INPUT_PASSWORD: ${{ inputs.password }}
          SECRET_PASSWORD: ${{ secrets.VNC_PASSWORD }}
          FLAVOR: ${{ inputs.flavor }}
          MOUNT_DIR: ${{ inputs.mount_workspace && github.workspace || '' }}
          CONFIG_DIR: ${{ inputs.cache_config && '/home/runner/desktop-config' || '' }}
          SOFTWARE_RENDER: ${{ inputs.software_render }}
          RESOLUTION: ${{ inputs.resolution }}
          GPU_VENDOR: ${{ inputs.gpu }}
          USE_WAYLAND: ${{ inputs.wayland }}
        run: |
          set -euo pipefail
          # "1280x720" is friendlier to type into than JSON, so translate here.
          if [[ "$RESOLUTION" =~ ^([0-9]+)x([0-9]+)$ ]]; then
            export SOFTWARE_WIDTH="${BASH_REMATCH[1]}"
            export SOFTWARE_HEIGHT="${BASH_REMATCH[2]}"
          else
            echo "::error::resolution must look like 1280x720, got '$RESOLUTION'"
            exit 1
          fi

          # ---------- GPU passthrough ----------
          # With a real GPU we must not force llvmpipe, and the device has to be
          # handed to the container. Leave AUTO_GPU alone so Selkies detects the
          # encoder itself and picks NVENC or VA-API.
          case "${GPU_VENDOR:-none}" in
            nvidia)
              export SOFTWARE_RENDER=false
              export EXTRA_DOCKER_ARGS="${EXTRA_DOCKER_ARGS:-} --gpus all -e NVIDIA_DRIVER_CAPABILITIES=all"
              echo "::notice::NVIDIA passthrough: --gpus all"
              ;;
            amd)
              export SOFTWARE_RENDER=false
              export EXTRA_DOCKER_ARGS="${EXTRA_DOCKER_ARGS:-} --device /dev/dri/renderD128"
              export DRI_NODE=/dev/dri/renderD128
              echo "::notice::AMD passthrough: /dev/dri/renderD128"
              ;;
            *)
              echo "::notice::no GPU requested; using software rendering"
              ;;
          esac
          # Xvfb is a software framebuffer, so real GPU rendering needs the
          # Wayland compositor that webtop can run instead.
          if [[ "${USE_WAYLAND:-false}" == "true" ]]; then
            export PIXELFLUX_WAYLAND=true
            echo "::notice::Wayland mode enabled (needed for GPU-accelerated rendering)"
          fi

          # A self-hosted box has a real disk, so persist there rather than
          # through the Actions cache.
          if [[ "${{ inputs.runner }}" == self-hosted* ]]; then
            export CONFIG_DIR="${HOME}/.desktop-config"
            mkdir -p "$CONFIG_DIR"
            echo "::notice::self-hosted runner detected; persisting to $CONFIG_DIR"
          fi

          if [[ -n "$INPUT_PASSWORD" ]]; then
            export PASSWORD="$INPUT_PASSWORD"
          elif [[ -n "$SECRET_PASSWORD" ]]; then
            export PASSWORD="$SECRET_PASSWORD"
          fi
          bash scripts/desktop.sh up

      - name: Open public tunnel
        env:
          ALLOWED_MAILS: ${{ inputs.allowed_emails }}
        run: bash scripts/desktop.sh tunnel

      - name: Publish URL
        id: publish
        env:
          SESSION_MINUTES: ${{ inputs.session_minutes }}
          SOFTWARE_RENDER: ${{ inputs.software_render }}
          GPU_VENDOR: ${{ inputs.gpu }}
        run: |
          set -euo pipefail
          source "$DESKTOP_STATE_DIR/state.env"

          {
            echo "url=$PUBLIC_URL"
            echo "password=$PASSWORD"
          } >>"$GITHUB_OUTPUT"

          {
            echo "## Desktop is live"
            echo
            echo "### [$PUBLIC_URL]($PUBLIC_URL)"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Username | \`$VNC_USER\` |"
            echo "| Password | \`$PASSWORD\` |"
            echo "| Image | \`$IMAGE\` |"
            echo "| Render | $( [ "$SOFTWARE_RENDER" = "true" ] && echo "software (llvmpipe)" || echo "GPU passthrough" ) |"
            echo "| GPU requested | $GPU_VENDOR |"
            echo "| Ends | ~$SESSION_MINUTES min from now, or when you cancel this job |"
            echo
            echo "Anyone with the URL can reach the login screen. Cancel the job to kill it."
            if [[ "$PASSWORD" == "***" ]]; then
              echo
              echo "**The password is masked** because it came from the \`VNC_PASSWORD\`"
              echo "repository secret and GitHub will not print it to the log. Pass a"
              echo "password in the workflow input instead if you need to read it back."
            fi
          } >>"$GITHUB_STEP_SUMMARY"

          echo "Desktop URL: $PUBLIC_URL"

      - name: Keep session alive
        env:
          SESSION_MINUTES: ${{ inputs.session_minutes }}
        run: |
          set -euo pipefail
          source "$DESKTOP_STATE_DIR/state.env"
          minutes=$(( SESSION_MINUTES < 355 ? SESSION_MINUTES : 355 ))
          end=$(( SECONDS + minutes * 60 ))
          while (( SECONDS < end )); do
            if ! docker inspect -f '{{.State.Running}}' "$CONTAINER" >/dev/null 2>&1; then
              echo "::error::desktop container is gone"
              exit 1
            fi
            printf 'alive, %dm remaining\n' $(( (end - SECONDS) / 60 ))
            sleep 30
          done
          echo "Session window elapsed."

      - name: Snapshot installed packages
        if: always() && inputs.save_packages
        run: |
          set -euo pipefail
          # Before teardown: the container must still exist to enumerate packages.
          if ! docker inspect -f '{{.State.Running}}' ubuntu-desktop >/dev/null 2>&1; then
            echo "container already gone, skipping snapshot"
            exit 0
          fi
          bash scripts/desktop.sh snapshot || echo "::warning::package snapshot failed"

          if git diff --quiet -- desktop-packages.txt 2>/dev/null &&
             git ls-files --error-unmatch desktop-packages.txt >/dev/null 2>&1; then
            echo "manifest unchanged, nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop-packages.txt
          git commit -q -m "desktop: record installed packages for reuse" || {
            echo "nothing staged, skipping commit"; exit 0; }
          git push origin HEAD:${{ github.ref_name }} || echo "::warning::push failed (may need a PR)"
          echo "manifest committed"

      - name: Diagnostics
        if: always()
        run: |
          echo "--- container logs (tail) ---"
          docker logs --tail 60 ubuntu-desktop 2>&1 || true
          echo
          echo "--- cloudflared logs (tail) ---"
          tail -n 30 "$DESKTOP_STATE_DIR/cloudflared.log" 2>/dev/null || true

      - name: Tear down
        if: always()
        run: bash scripts/desktop.sh down || true