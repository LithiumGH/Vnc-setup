name: Windows 11 VNC

# Streams the desktop of a GitHub-hosted windows-11-arm runner into the browser.
#
# Proven viable by windows-probe.yml: that runner has a real interactive
# desktop (not just session 0), x86/x64 emulation works, and RDP is enabled.
#
# Chain:
#   TightVNC (captures the desktop) -> websockify (VNC -> WebSocket)
#     -> noVNC launcher page (browser client) -> cloudflared (public HTTPS)
#
# The work lives in scripts/windows-vnc.ps1. It is not inline because GitHub
# treats the whole run: body as a single expression and rejects it above 21000
# characters, which this script exceeds.

on:
  workflow_dispatch:
    inputs:
      password:
        description: VNC password (blank = auto-generate)
        type: string
        required: false
      session_minutes:
        description: Session length in minutes (max 355)
        type: number
        default: 120
      allowed_emails:
        description: Restrict access with a Cloudflare one-time PIN
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: windows-vnc
  cancel-in-progress: true

jobs:
  vnc:
    name: Windows 11 desktop
    runs-on: windows-11-arm
    timeout-minutes: 360

    env:
      NOVNC_VERSION: v1.7.0
      TIGHTVNC_URL: https://www.tightvnc.com/download/2.8.89/tightvnc-2.8.89-gpl-setup-64bit.msi
      # cloudflared ships no arm64 Windows build, so this is the amd64 one
      # running emulated.
      CLOUDFLARED_URL: https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe
      VNC_PORT: "5900"
      HTTP_PORT: "6080"
      VNC_PASSWORD_INPUT: ${{ inputs.password }}
      SESSION_MINUTES: ${{ inputs.session_minutes }}
      ALLOWED_EMAILS: ${{ inputs.allowed_emails }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Serve the desktop
        # One step on purpose: on Windows runners a process started with
        # Start-Process is torn down when its step ends, which killed cloudflared
        # and produced error 1033. The script starts everything and then holds
        # the session open in this same step.
        timeout-minutes: 360
        shell: pwsh
        run: pwsh ./scripts/windows-vnc.ps1

      - name: Diagnostics
        if: always()
        shell: pwsh
        run: pwsh ./scripts/windows-diagnostics.ps1

      - name: Tear down
        if: always()
        shell: pwsh
        run: |
          foreach ($n in @('tvnserver')) {
            Stop-Service -Name $n -Force -ErrorAction SilentlyContinue
          }
          Get-Process -Name 'cloudflared','python' -ErrorAction SilentlyContinue |
            Where-Object { $_.Path -like "*$env:RUNNER_TEMP*" } |
            Stop-Process -Force -ErrorAction SilentlyContinue
          Write-Host "torn down"